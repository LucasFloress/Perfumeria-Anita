# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - perfumeria-anita

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build with dotnet
        run: dotnet build PerfumeriaAnita.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish PerfumeriaAnita.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

      steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: myapp   # Descarga el artefacto en una carpeta limpia llamada 'myapp'
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8DEA5BDC424245AABC72A86EEA33F8B7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FFA08BBF7B8B47ABBF362D16F49CF929 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6E654A2B7B314D529B937F0F842918BD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'perfumeria-anita'
          slot-name: 'Production'
          package: myapp   # Despliega únicamente los archivos dentro de esa carpeta
